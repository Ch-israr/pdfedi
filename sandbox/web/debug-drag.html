<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Drag debug</title>
<script src="https://unpkg.com/konva@9.3.16/konva.min.js"></script>
<style>
  body { font-family: monospace; margin: 0; display: flex; }
  #wrap { position: relative; }
  #log { width: 420px; height: 100vh; overflow-y: auto; background: #0f172a; color: #a5f3a5;
         padding: 10px; font-size: 12px; white-space: pre-wrap; }
</style></head>
<body>
<div id="wrap"><div id="stage"></div></div>
<div id="log">LOG START&#10;</div>
<script>
  const logEl = document.getElementById('log');
  function log(...args) {
    logEl.textContent += args.join(' ') + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }
  log('Konva version:', Konva.version);

  const stage = new Konva.Stage({ container: 'stage', width: 600, height: 600 });
  const layer = new Konva.Layer();
  stage.add(layer);
  const text = new Konva.Text({
    x: 100, y: 100, text: 'DRAG ME', fontSize: 30, fill: 'black',
  });
  text.setAttr('opId', 'test-1');
  layer.add(text);
  layer.draw();

  function findOpNode(target, stage) {
    let n = target;
    while (n && n !== stage) {
      if (n.getAttr && n.getAttr('opId')) return n;
      n = (typeof n.getParent === 'function') ? n.getParent() : null;
    }
    return null;
  }

  let _drag = null;
  const activeTool = 'select';

  stage.on('pointerdown', e => {
    log('POINTERDOWN target=' + (e.target === stage ? 'STAGE' : e.target.className) +
        ' activeTool=' + activeTool);
    if (activeTool === 'select' && e.target !== stage && !_drag) {
      const node = findOpNode(e.target, stage);
      log('  findOpNode -> ' + (node ? node.className + ' opId=' + node.getAttr('opId') : 'null'));
      if (node) {
        const pos = stage.getPointerPosition();
        log('  pointerPos=' + JSON.stringify(pos));
        _drag = { node, sx: pos.x, sy: pos.y, nx: node.x(), ny: node.y(), moved: false };
        log('  _drag SET');
      }
    }
  });
  stage.on('pointermove', e => {
    if (_drag) {
      const pos = stage.getPointerPosition();
      const dx = pos.x - _drag.sx, dy = pos.y - _drag.sy;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) _drag.moved = true;
      if (_drag.moved) {
        _drag.node.x(_drag.nx + dx);
        _drag.node.y(_drag.ny + dy);
        layer.batchDraw();
        log('  DRAGMOVE dx=' + Math.round(dx) + ' dy=' + Math.round(dy));
      }
    }
  });
  stage.on('pointerup', e => {
    log('POINTERUP moved=' + (_drag ? _drag.moved : 'no-drag'));
    _drag = null;
  });
  stage.on('click', e => {
    log('CLICK target=' + (e.target === stage ? 'STAGE' : e.target.className));
  });
  stage.on('dblclick', e => {
    log('DBLCLICK target=' + (e.target === stage ? 'STAGE' : e.target.className));
  });
  log('handlers attached; drag the text and watch');
</script>
</body></html>
