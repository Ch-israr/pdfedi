# Netlify configuration for the combined PDFEDI deployment
# (Next.js frontend + FastAPI backend as a Python serverless function).
# Vercel remains configured via vercel.json; the two can coexist.

[build]
  command = "npm run build"
  publish = ".next"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.12"
  # NOTE: NEXT_PUBLIC_API_URL is intentionally NOT set here.
  # The frontend (lib/api.ts) defaults to same-origin /api/v1 when it is
  # absent, which the redirect below serves from the Python function.

# Serve the FastAPI backend from the same origin: /api/v1/* -> function.
# The original path is embedded after the function prefix so the handler
# can always reconstruct /api/v1/... deterministically.
[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/api/api/v1/:splat"
  status = 200
  force = true

# Don't let the API rewrite swallow Next.js internals (safety net).
[[redirects]]
  from = "/_next/*"
  to = "/_next/:splat"
  status = 200
