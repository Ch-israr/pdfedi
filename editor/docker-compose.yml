services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_PDF_API_URL=http://localhost:4000
      - NEXT_PUBLIC_FASTAPI_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CORS_ORIGINS=http://localhost:3000
      - REDIS_URL=redis://redis:6379
      - MAX_UPLOAD_BYTES=52428800
      - LOG_LEVEL=info
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    # NOTE: Redis holds only BullMQ job metadata for heavy operations.
    # PDF bytes are NEVER queued — jobs reference in-request buffers only.

volumes:
  redis-data:
